{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubelease.webhook.serviceAccountName" . }}
  labels:
    {{- include "kubelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
  {{- with .Values.webhook.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Webhook RBAC: leases + policies + own secret only. NO namespace delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubelease.webhook.fullname" . }}
  labels:
    {{- include "kubelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: ["platform.kubelease.io"]
    resources: ["environmentleases"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["platform.kubelease.io"]
    resources: ["environmentleases/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["platform.kubelease.io"]
    resources: ["environmentleasepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubelease.webhook.fullname" . }}
  labels:
    {{- include "kubelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubelease.webhook.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubelease.webhook.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubelease.webhook.fullname" . }}-token
  labels:
    {{- include "kubelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ default (printf "%s-token" (include "kubelease.webhook.fullname" .)) .Values.webhook.existingSecret }}
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubelease.webhook.fullname" . }}-token
  labels:
    {{- include "kubelease.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubelease.webhook.fullname" . }}-token
subjects:
  - kind: ServiceAccount
    name: {{ include "kubelease.webhook.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
