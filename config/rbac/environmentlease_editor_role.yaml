# This rule is not used by the project kubelease itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the platform.kubelease.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubelease
    app.kubernetes.io/managed-by: kustomize
  name: environmentlease-editor-role
rules:
- apiGroups:
  - platform.kubelease.io
  resources:
  - environmentleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.kubelease.io
  resources:
  - environmentleases/status
  verbs:
  - get
