---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: clustertargets.platform.kubelease.io
spec:
  group: platform.kubelease.io
  names:
    kind: ClusterTarget
    listKind: ClusterTargetList
    plural: clustertargets
    shortNames:
    - ctarget
    - cltarget
    singular: clustertarget
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.kubernetesVersion
      name: Version
      type: string
    - jsonPath: .status.capacity.activeLeases
      name: Leases
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterTarget registers a remote Kubernetes cluster for EnvironmentLease provisioning.

          Design notes:
            - Cluster-scoped: targets are platform infrastructure shared across teams.
            - Credentials live only in Secrets referenced by secretRef (never inlined).
            - Auth model today is kubeconfig; the credentials struct is extensible for
              SA tokens / workload identity later.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterTargetSpec defines a remote Kubernetes cluster that
              may host leased environments.
            properties:
              clientBurst:
                description: |-
                  ClientBurst overrides the default remote client burst for this target.
                  Capped at 100.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              clientQPS:
                description: |-
                  ClientQPS overrides the default remote client QPS for this target.
                  Safe default is applied when unset (see remote provider). Capped at 50.
                format: int32
                maximum: 50
                minimum: 1
                type: integer
              credentials:
                description: Credentials references authentication material. Never
                  embed kubeconfig here.
                properties:
                  secretRef:
                    description: SecretRef points at a Secret containing a kubeconfig
                      (client-go format).
                    properties:
                      key:
                        default: kubeconfig
                        description: Key within the Secret. Defaults to "kubeconfig".
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the Secret. Required because ClusterTarget is cluster-scoped.
                          Prefer the KubeLease control-plane namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - secretRef
                type: object
              enabled:
                description: |-
                  Enabled, when false, rejects new/ongoing provisioning against this target.
                  Defaults to true when omitted.
                type: boolean
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are optional scheduling labels merged with metadata.labels for
                  placement matching. Prefer metadata.labels with kubelease.io/* keys.
                  Not copied onto remote Namespaces automatically.
                type: object
              maxActiveLeases:
                description: |-
                  MaxActiveLeases is a soft capacity ceiling for placement.
                  Counts are best-effort (not transactional); races may slightly exceed this.
                format: int32
                minimum: 0
                type: integer
            required:
            - credentials
            type: object
          status:
            description: ClusterTargetStatus is the observed health of a remote cluster
              connection.
            properties:
              capacity:
                description: Capacity tracks soft lease-count usage for placement.
                properties:
                  activeLeases:
                    description: |-
                      ActiveLeases is the soft count of EnvironmentLeases with status.cluster.name
                      equal to this target (best-effort).
                    format: int32
                    type: integer
                  maxLeases:
                    description: MaxLeases mirrors Spec.MaxActiveLeases when set.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the target.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              kubernetesVersion:
                description: KubernetesVersion is the remote server version when reachable.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              remoteIdentity:
                description: |-
                  RemoteIdentity is a sticky fingerprint of the remote API (kube-system UID).
                  Set on first successful health probe and compared thereafter; credential
                  rotation that points at a different cluster sets Ready=False (IdentityDrift).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
