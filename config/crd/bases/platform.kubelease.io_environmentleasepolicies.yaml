    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EnvironmentLeasePolicy is a reusable cluster-scoped policy for EnvironmentLeases.
          Policies provide defaults for omitted lease fields and hard limits that are
          rejected (never silently clamped) when violated.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentLeasePolicySpec defines reusable defaults and
              hard limits.
            properties:
              idleTTL:
                description: |-
                  IdleTTL configures defaults/limits for EnvironmentLease.spec.idleTTL.
                  Idle detection is enforced in a later phase; values are resolved and validated now.
                properties:
                  default:
                    description: Default is applied when the lease omits the corresponding
                      field.
                    type: string
                  maximum:
                    description: Maximum is a hard upper bound. Lease values above
                      this are rejected.
                    type: string
                  minimum:
                    description: Minimum is a hard lower bound. Lease values below
                      this are rejected.
                    type: string
                type: object
              maxTTL:
                description: |-
                  MaxTTL configures defaults/limits for EnvironmentLease.spec.maxTTL.
                  When unset, ttl.maximum (if present) is also used as the maxTTL ceiling.
                properties:
                  default:
                    description: Default is applied when the lease omits the corresponding
                      field.
                    type: string
                  maximum:
                    description: Maximum is a hard upper bound. Lease values above
                      this are rejected.
                    type: string
                  minimum:
                    description: Minimum is a hard lower bound. Lease values below
                      this are rejected.
                    type: string
                type: object
              networkPolicy:
                description: NetworkPolicy configures NetworkPolicy defaults/requirements.
                properties:
                  defaultDenyDefault:
                    description: DefaultDenyDefault is applied when the lease omits
                      NetworkPolicy.DefaultDeny.
                    type: boolean
                  defaultDenyRequired:
                    description: |-
                      DefaultDenyRequired, when true, requires default-deny NetworkPolicy.
                      Leases that explicitly set defaultDeny=false are rejected.
                    type: boolean
                type: object
              quota:
                description: Quota configures hard ceilings for lease quota.
                properties:
                  maxCPU:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxCPU is the maximum allowed CPU for quota requests
                      and limits.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  maxMemory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxMemory is the maximum allowed memory for quota
                      requests and limits.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              renewable:
                description: Renewable configures default/force for EnvironmentLease.spec.renewable.
                properties:
                  default:
                    description: Default is applied when the lease omits the field.
                    type: boolean
                  force:
                    description: |-
                      Force, when set, requires the effective value to equal this.
                      Mismatches are rejected (not silently overridden beyond applying when unset).
