              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentLeasePolicySpec defines reusable defaults and
              hard limits.
            properties:
              idleTTL:
                description: IdleTTL configures defaults/limits for EnvironmentLease.spec.idleTTL.
                properties:
                  default:
                    description: Default is applied when the lease omits the corresponding
                      field.
                    type: string
                  maximum:
                    description: Maximum is a hard upper bound. Lease values above
                      this are rejected.
                    type: string
                  minimum:
                    description: Minimum is a hard lower bound. Lease values below
