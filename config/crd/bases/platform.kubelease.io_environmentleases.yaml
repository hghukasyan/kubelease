---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: environmentleases.platform.kubelease.io
spec:
  group: platform.kubelease.io
  names:
    kind: EnvironmentLease
    listKind: EnvironmentLeaseList
    plural: environmentleases
    shortNames:
    - envlease
    - el
    singular: environmentlease
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.cluster.name
      name: Cluster
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.effectiveExpiresAt
      name: Expires
      type: date
    - jsonPath: .status.expirationReason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EnvironmentLease is the Schema for the environmentleases API.
          It is cluster-scoped because it manages Namespaces (cluster-scoped) and
          supporting resources inside those namespaces.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EnvironmentLeaseSpec defines the desired state of EnvironmentLease.

              Renewal model: extend a lease by increasing Spec.TTL. The controller derives
              status.expiresAt = status.createdAt + effectiveTTL and clamps it to
              status.maximumExpiresAt (= createdAt + effectiveMaxTTL).

              When PolicyRef is set, omitted fields take policy defaults. Values that
              violate policy hard limits are rejected (not silently clamped).

              Cluster targeting precedence:
               1. clusterRef → exact ClusterTarget
               2. placement → deterministic selector against ClusterTargets
               3. neither → local control-plane cluster

              clusterRef and placement are mutually exclusive.
            properties:
              cleanupPolicy:
                description: |-
                  CleanupPolicy controls finalizer behavior when remote cleanup fails.
                  Default: RequireRemoteCleanup (do not drop the finalizer while the remote
                  cluster is unreachable). Use BestEffort only when operators accept orphans.
                properties:
                  mode:
                    default: RequireRemoteCleanup
                    description: Mode defaults to RequireRemoteCleanup when unset.
                    enum:
                    - RequireRemoteCleanup
                    - BestEffort
                    type: string
                type: object
              clusterRef:
                description: |-
                  ClusterRef selects a ClusterTarget for remote provisioning.
                  When omitted (and placement is also omitted), the environment is created
                  on the local (control-plane) cluster.
                  Credentials are never stored on the lease; only the target name is referenced.
                  Mutually exclusive with Placement.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              idleTTL:
                description: |-
                  IdleTTL is the inactivity window before an idle environment may expire.
                  When set, effective expiration is min(hardExpiresAt, lastActivityAt+idleTTL).
                  Heartbeats (kubectl kubelease touch) update status.lastActivityAt.
                  Activity can never bypass the hard TTL / maxTTL.
                type: string
              limits:
                description: Limits, if set, creates a LimitRange in the managed Namespace.
                properties:
                  default:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Default are default limits applied to containers
                      that omit limits.
                    type: object
                  defaultRequest:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: DefaultRequest are default requests applied to containers
                      that omit requests.
                    type: object
                  max:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Max is the maximum amount of resources a container
                      may request/limit.
                    type: object
                  min:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Min is the minimum amount of resources a container
                      may request/limit.
                    type: object
                type: object
              maxTTL:
                description: |-
                  MaxTTL is the absolute maximum lifetime from CreatedAt.
                  If unset, defaults to effective TTL (or policy maxTTL/ttl.maximum).
                type: string
              namespace:
                description: Namespace configures the managed Namespace.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are applied to the managed Namespace.
                    type: object
                  generateName:
                    description: |-
                      GenerateName is a prefix used with Kubernetes generateName semantics when
                      Name is empty. Example: "preview-" yields names like "preview-r82jx".
                    type: string
                  labels:
                    additionalProperties:
                      type: string
                    description: |-
                      Labels are applied to the managed Namespace (in addition to KubeLease
                      management labels).
                    type: object
                  name:
                    description: |-
                      Name, if set, creates a Namespace with this exact name. Takes precedence
                      over GenerateName. Must not be a protected system namespace.
                    type: string
                type: object
              networkPolicy:
                description: NetworkPolicy configures NetworkPolicy resources for
                  the environment.
                properties:
                  defaultDeny:
                    description: |-
                      DefaultDeny, when true, creates a NetworkPolicy that denies all ingress
                      and egress traffic by default.
                    type: boolean
                type: object
              owner:
                description: Owner identifies who requested the environment.
                properties:
                  name:
                    description: Name is the individual owner of the environment.
                    type: string
                  team:
                    description: Team is the owning team.
                    type: string
                type: object
              placement:
                description: |-
                  Placement selects a ClusterTarget by label selector when ClusterRef is omitted.
                  Selection is persisted in status.cluster.name and remains sticky after
                  provisioning begins. Mutually exclusive with ClusterRef.
                properties:
                  selector:
                    description: |-
                      Selector matches ClusterTarget scheduling labels (prefer metadata.labels
                      with kubelease.io/* keys; spec.labels are also considered).
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              policyRef:
                description: PolicyRef references a cluster-scoped EnvironmentLeasePolicy.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              quota:
                description: Quota, if set, creates a ResourceQuota in the managed
                  Namespace.
                properties:
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Limits are summed into ResourceQuota hard as limits.<resource>.
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Requests are summed into ResourceQuota hard as requests.<resource>.
                    type: object
                type: object
              renewable:
                description: |-
                  Renewable controls whether Spec.TTL may be increased to extend the lease.
                  Defaults to true when omitted (unless policy forces otherwise).
                type: boolean
              ttl:
                description: |-
                  TTL is the requested lifetime from CreatedAt.
                  Optional when PolicyRef provides ttl.default; otherwise required.
                type: string
              warnings:
                description: |-
                  Warnings are durations before expiration at which LeaseExpiring events
                  should be emitted (e.g. "1h", "15m"). Must be unique and > 0.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - namespace
            type: object
            x-kubernetes-validations:
            - message: clusterRef and placement are mutually exclusive
              rule: '!(has(self.clusterRef) && has(self.placement))'
          status:
            description: EnvironmentLeaseStatus defines the observed state of EnvironmentLease.
            properties:
              cluster:
                description: Cluster identifies the target cluster hosting the Namespace.
                properties:
                  name:
                    description: |-
                      Name is the ClusterTarget name, or "local" when clusterRef/placement
                      resolved to the control-plane cluster.
                    type: string
                  remoteIdentity:
                    description: |-
                      RemoteIdentity is a stable remote cluster fingerprint (typically the
                      kube-system Namespace UID) captured when the environment was provisioned.
                      Cleanup refuses to proceed if the live target identity differs.
                    type: string
                  targetUID:
                    description: TargetUID is the ClusterTarget UID at selection time
                      (empty for local).
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the lease.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createdAt:
                description: |-
                  CreatedAt is when the lease window started. Initialized once from
                  metadata.creationTimestamp and never reset on controller restart.
                format: date-time
                type: string
              effective:
                description: Effective holds the policy-resolved values used for reconciliation.
                properties:
                  defaultDeny:
                    description: DefaultDeny is whether default-deny NetworkPolicy
                      is effective.
                    type: boolean
                  idleTTL:
                    description: IdleTTL is the effective idle TTL when configured.
                    type: string
                  maxTTL:
                    description: MaxTTL is the effective maximum lifetime.
                    type: string
                  policyName:
                    description: PolicyName is the referenced policy, if any.
                    type: string
                  renewable:
                    description: Renewable is the effective renewability.
                    type: boolean
                  ttl:
                    description: TTL is the effective lease TTL.
                    type: string
                required:
                - defaultDeny
                - maxTTL
                - renewable
                - ttl
                type: object
              effectiveExpiresAt:
                description: |-
                  EffectiveExpiresAt is min(ExpiresAt, IdleExpiresAt) when idle is enabled,
                  otherwise equal to ExpiresAt. Controllers schedule and expire against this.
                format: date-time
                type: string
              expirationReason:
                description: ExpirationReason is set when the lease has effectively
                  expired.
                enum:
                - TTLExpired
                - IdleTimeout
                - ManualExpiration
                - SourceClosed
                type: string
              expiresAt:
                description: 'ExpiresAt is the hard expiration: CreatedAt + Spec.TTL,
                  <= MaximumExpiresAt.'
                format: date-time
                type: string
              idleExpiresAt:
                description: |-
                  IdleExpiresAt is LastActivityAt + effective idleTTL when idleTTL is set.
                  Capped so it never exceeds ExpiresAt / MaximumExpiresAt.
                format: date-time
                type: string
              lastActivityAt:
                description: |-
                  LastActivityAt is the last observed heartbeat. Initialized to CreatedAt and
                  updated by explicit activity (kubectl kubelease touch). Lives in status
                  because it is observed runtime state, not desired configuration.
                format: date-time
                type: string
              maximumExpiresAt:
                description: MaximumExpiresAt is CreatedAt + effective MaxTTL. Renewals
                  cannot exceed this.
                format: date-time
                type: string
              namespace:
                description: Namespace is the name of the managed Namespace.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a human-readable summary of the lease lifecycle.
                  Prefer Conditions for programmatic decisions.
                enum:
                - Pending
                - Provisioning
                - Active
                - Expiring
                - Cleaning
                - Expired
                - Failed
                type: string
              warningsDelivered:
                description: |-
                  WarningsDelivered lists warning durations (canonical strings like "1h")
                  for which a LeaseExpiring event has already been emitted.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
