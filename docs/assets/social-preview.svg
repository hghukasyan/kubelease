  <text x="600" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="32" fill="#94a3b8">Ephemeral Kubernetes environments</text>
  <text x="600" y="410" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="32" fill="#94a3b8">that clean themselves up.</text>
  <text x="600" y="560" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
