  <rect x="260" y="56" width="280" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="400" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#0c4a6e">EnvironmentLease · Policy · ClusterTarget</text>
  <text x="400" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0369a1">KubeLease controller</text>
  <line x1="400" y1="126" x2="400" y2="170" stroke="#64748b" stroke-width="2"/>
